<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>女性角色样式预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eddf;color:#514d43;font-family:'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:34px auto;padding:0 24px}h1{font-size:25px;margin:0 0 10px}p{color:#797568;font-size:14px;line-height:1.8}.toolbar{display:flex;align-items:center;gap:12px;margin:22px 0 26px}.swatch{width:26px;height:26px;border:2px solid #fff;outline:1px solid #c8bea7;cursor:pointer}input{width:45px;height:30px;border:0;padding:0;background:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{background:#fffaf0;border:2px solid #c6b99c;box-shadow:4px 4px #ded5c2;padding:18px 12px;text-align:center}.badge{font-weight:bold;color:#67816b;font-size:14px}.sprite{width:144px;height:168px;margin:14px auto 10px;background:repeating-conic-gradient(#e9e0cb 0% 25%,#eee7d7 0% 50%) 0 0/16px 16px;image-rendering:pixelated}.card h2{font-size:17px;margin:0 0 7px}.card p{font-size:12px;min-height:44px;margin:0}.small{display:flex;justify-content:center;align-items:center;gap:8px;border-top:1px solid #e5dcc8;margin-top:16px;padding-top:12px;font-size:11px;color:#8b826f}.small canvas{image-rendering:pixelated}footer{font-size:12px;color:#8c8370;margin-top:26px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<h1>女性角色 · 四款像素样式</h1><p>收窄衣身和下摆，保持原有像素比例；发卡跟随衣服颜色，男女角色均补上手臂与手掌。</p>
<div class="toolbar"><label for="color">代表色</label><input id="color" type="color" value="#598f9c"><button class="swatch" style="background:#598f9c" data-color="#598f9c" aria-label="蓝绿色"></button><button class="swatch" style="background:#b87881" data-color="#b87881" aria-label="豆沙色"></button><button class="swatch" style="background:#8b9b72" data-color="#8b9b72" aria-label="绿色"></button><button class="swatch" style="background:#a28ab4" data-color="#a28ab4" aria-label="紫色"></button><span style="font-size:12px;color:#8c8370">可切换颜色对比</span></div>
<div class="grid" id="grid"></div><footer>大图用于观察像素细节；下方为游戏中的显示大小。发型和衣服款式供选，颜色仍由模型自主选择。</footer>
</main><script src="../web/pixel-scene.js"></script><script>
const styles=[['A','清爽短发','短发＋简洁直身裙','轻巧、接近原有形象'],['B','温柔长发','及肩长发＋收腰连衣裙','腰线柔和，下摆收窄'],['C','活力马尾','侧马尾＋上衣长裤','休闲、利落'],['D','俏皮短裙','短发＋上衣短裙','浅色腰线，更有层次'],['男','男性对照','保留原有造型','增加同风格手臂与手掌']];
const grid=document.getElementById('grid');
for(const [id,title,outfit,desc]of styles){const el=document.createElement('section');el.className='card';el.innerHTML=`<div class="badge">${id==='男'?'原形象对照':'样式 '+id}</div><canvas class="sprite" width="144" height="168"></canvas><h2>${title}</h2><p>${outfit}<br>${desc}</p><div class="small"><canvas width="48" height="56"></canvas><span>游戏大小</span></div>`;grid.appendChild(el);}
function paint(){const color=document.getElementById('color').value;document.querySelectorAll('.card').forEach((el,i)=>{for(const cv of el.querySelectorAll('canvas'))PixelScene.preview(cv.getContext('2d'),{gender:i===4?'男':'女',style:styles[i][0],color},cv.width/24);});}
document.getElementById('color').oninput=paint;document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{document.getElementById('color').value=b.dataset.color;paint()});paint();
</script></body></html>
