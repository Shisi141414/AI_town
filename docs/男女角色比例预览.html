<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>A款男女比例预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3eddf;color:#514d43;font-family:'Microsoft YaHei',sans-serif}main{width:660px;padding:30px;margin:auto}h1{font-size:23px;margin:0 0 10px}p{font-size:13px;color:#827a68;line-height:1.7}.row{display:flex;gap:24px;margin-top:22px}.card{width:288px;background:#fffaf0;border:2px solid #c6b99c;padding:18px;text-align:center;box-shadow:4px 4px #ded5c2}h2{font-size:17px;margin:0 0 12px}.large{display:block;margin:auto;width:192px;height:224px;image-rendering:pixelated;background:repeating-conic-gradient(#e9e0cb 0% 25%,#eee7d7 0% 50%) 0 0/16px 16px}.small{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:14px;font-size:12px;color:#827a68}.small canvas{image-rendering:pixelated}footer{margin-top:24px;font-size:13px;color:#827a68}
</style></head><body><main><h1>A 款 · 男女等高、直腿预览</h1><p>女生肤色直腿，男生深色长裤；底部一层黑色鞋子，不向两侧伸出。<br>女生使用圆润短发、错落刘海与发梢；男女等高、腿长相同，发卡与衣服同色。</p><div class="row"><section class="card"><h2>A 款女性</h2><canvas class="large" width="192" height="224"></canvas><div class="small"><canvas width="48" height="56"></canvas>游戏大小</div></section><section class="card"><h2>男性对照</h2><canvas class="large" width="192" height="224"></canvas><div class="small"><canvas width="48" height="56"></canvas>游戏大小</div></section></div><footer>已确认并应用到游戏。男女等高、直腿等长，发卡随代表色变化。</footer></main><script src="../web/pixel-scene.js"></script><script>
document.querySelectorAll('.card').forEach((card,i)=>{for(const cv of card.querySelectorAll('canvas'))PixelScene.preview(cv.getContext('2d'),{gender:i?'男':'女',color:'#598f9c',style:'A',straightLegs:true,naturalHair:true,darkPants:true},cv.width/24)});
</script></body></html>
